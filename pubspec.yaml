name: edonia
description: "Edonia: A high-precision privacy watcher for Android 15+"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  
  # State Management
  flutter_riverpod: ^3.4.3
  
  # UI & Visualization
  fl_chart: ^1.3.0
  
  # Permissions & App Info
  permission_handler: 11.3.1
  device_info_plus: ^13.3.0
  
  # The Watcher Engines
  # Storage & Metadata
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
